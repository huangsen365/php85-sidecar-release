# A conf2.d vhost in the form web001/002 use (2026-11-07), renamed to test.local; plain http for the test.
<VirtualHost *:80>
    ServerName test.local
    DocumentRoot "/var/www/test.local/public"
    <Directory "/var/www/test.local/public">
        Require all granted
    </Directory>
    #ProxyPassMatch "/gitpull.php" fcgi://127.0.0.1:7401/var/www/test.local/www/gitpull.php
    ProxyPassMatch "/gitpull.php" fcgi://127.0.0.1:7401/var/www/gitpull.php
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:7401/var/www/test.local/public/$1
    #ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:7401/var/www/test.local/public/index.php
    DirectoryIndex index.html index.php
</VirtualHost>
