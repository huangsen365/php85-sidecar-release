; Everything else stays at Remi's php.ini defaults, which match the php74 container's
; (memory_limit 128M, upload 2M, post 8M, opcache on with validate_timestamps). Per-site values live in the pools.
date.timezone = Asia/Shanghai
expose_php = Off

; One list for every pool, never per pool: on PHP 8.4+ pools with different disable_functions under one master share
; opcache and then call the wrong internal function (php-src#24661, open; seen here as session_save_path() running as
; session_set_cookie_params()). This is what all php74 site pools on web001/002 have in common (2026-11-07);
; some also block scandir and/or opendir, which the 8.5 pools allow. scripts/pool-from-php74.sh drops the pools'
; own lists and tests/smoke.sh fails on any pool that sets one.
disable_functions = passthru,system,chroot,chgrp,chown,proc_open,proc_get_status,ini_alter,ini_restore,dl,pfsockopen,openlog,syslog,readlink,symlink,popepassthru,stream_socket_server,get_current_user,leak,putenv,popen
