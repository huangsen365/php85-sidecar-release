; Serves no site: answers the health check (/ping) and runs /opt/sidecar/selftest.php for tests/smoke.sh.
[www-php85]
listen = 8500
pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
ping.path = /ping
pm.status_path = /status
php_admin_value[error_log] = /var/opt/remi/php85/log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = files
php_value[session.save_path] = /var/opt/remi/php74/lib/php/session
