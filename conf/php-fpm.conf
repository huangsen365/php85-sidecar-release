; php-fpm.d = pools baked into the image (www: health check and selftest only);
; php-fpm2.d = one pool per site, mounted from the host, same as the old container.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

include=/etc/opt/remi/php85/php-fpm.d/*.conf
include=/etc/opt/remi/php85/php-fpm2.d/*.conf
